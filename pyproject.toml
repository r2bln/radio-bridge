[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-bridge"
version = "0.1.0"
description = "Удалённый доступ к аналоговой УКВ-станции через браузер (PTT + приём), передача по VOX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
radio-bridge = "radio_bridge.__main__:main"

[tool.setuptools]
packages = ["radio_bridge"]

[tool.setuptools.package-data]
radio_bridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
